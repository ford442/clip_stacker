name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target site
        required: false
        default: test
        type: choice
        options:
          - test
          - go

permissions:
  contents: read

jobs:
  # The full Tests workflow (typecheck, lint, cycles, unit tests, build, WASM
  # drift, native host tests). Deploy only runs when every job passes.
  checks:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # Skip fork PRs and runs without the deploy token configured.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Contabo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'test' }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret is not configured — cannot deploy to test.1ink.us."
            exit 1
          fi
          python3 deploy.py

  # Post-deploy: the live smoke (e2e/live.spec.ts) against the published site.
  # Fails the workflow on any console / page / CSP error or failed request.
  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'go') && 'https://go.1ink.us/clip-stacker/' || 'https://test.1ink.us/clip-stacker/' }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the deployed build
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$LIVE_URL" | grep -q "name=\"clip-stacker-commit\" content=\"$EXPECTED_SHA\""; then
              echo "Live build is $EXPECTED_SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::$LIVE_URL never served commit $EXPECTED_SHA"; exit 1

      - name: Live smoke
        run: npm run e2e:live -- --trace off

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: playwright-report/
          retention-days: 14
