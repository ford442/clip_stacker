name: Tests

on:
  # main is covered by deploy.yml, which runs this whole workflow (via
  # workflow_call) before it deploys — one run per push, and nothing ships
  # that fails a job here.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 / Rolldown / ESLint 10 need Node ^20.19 || >= 22.12; Node 20
        # is end-of-life, so test the two current LTS lines.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate self-hosted FFmpeg cores from node_modules
        run: npm run sync:ffmpeg-core && npm run sync:ffmpeg-core -- --check

      - name: Typecheck
        run: npm run typecheck

      - name: Strict typecheck ratchet
        # noUncheckedIndexedAccess + exactOptionalPropertyTypes: zero errors in
        # scripts/strict-ratchet.json's strictDirs, and no growth elsewhere.
        run: npm run typecheck:strict

      - name: Lint
        run: npm run lint

      - name: Check import cycles
        run: npm run check:cycles

      - name: Dead code (knip, empty baseline)
        # Unused files, exports, types and dependencies fail the build. Mark a
        # deliberate extension point `@public` in its JSDoc instead.
        run: npm run knip

      - name: Run tests
        run: npm test -- --run

      - name: Build project
        run: npm run build

  e2e:
    name: Render regression harness (Playwright, SwiftShader WebGPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build project
        # prebuild generates the self-hosted FFmpeg cores from node_modules.
        run: npm run build

      - name: Goldens and smoke flows
        # webServer in playwright.config.ts runs `npm run preview`.
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  wasm:
    name: Build WASM modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # native/emsdk-version is the SDK the committed public/wasm artifacts
      # come from; scripts/emscripten-flags.sh reads the same file.
      - name: Read pinned Emscripten version
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < native/emsdk-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc -v

      - name: Build all WASM modules
        run: npm run build:wasm

      - name: compile_commands.json exported for clangd
        run: test -s native/build/compile_commands.json && test -e native/compile_commands.json

      - name: Fail on committed-artifact drift
        run: |
          git --no-pager diff --stat -- public/wasm
          git --no-pager diff --exit-code -- public/wasm
          # A module that is no longer built must not linger in public/wasm.
          test -z "$(git ls-files --others --exclude-standard -- public/wasm)"

  native-host:
    name: Native DSP host tests (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every shipped DSP module (audio_analysis, video_stabilize, media_engine
      # incl. the WSOLA time stretch and the bus graph) built with the host
      # compiler (no Emscripten) under -Werror, ASan + UBSan +
      # float-cast-overflow, run through ctest. Includes the THD+N goldens,
      # the allocation-counting real-time checks and the FX property subset.
      # `-L pr` skips the LONG_TEST_CASE battery, which nightly-native.yml runs.
      - name: Build and run ctest (PR subset)
        env:
          HOST_CTEST_ARGS: -L pr
        run: bash scripts/test-native.sh

  native-host-clang:
    name: Native DSP host tests (clang) + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same suite under clang's sanitizers (clang's UBSan differs from
      # GCC's; both run float-cast-overflow), then a short libFuzzer run of the
      # effect rows.
      - name: Build and run ctest (PR subset)
        env:
          CC: clang
          CXX: clang++
          HOST_BUILD_DIR: native/build-host-clang
          HOST_CTEST_ARGS: -L pr
        run: bash scripts/test-native.sh

      - name: Fuzz the effect rows (30 s)
        env:
          FUZZ_SECONDS: 30
        run: bash scripts/fuzz-native.sh
