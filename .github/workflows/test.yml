name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4 / rolldown import `styleText` from node:util (Node 20.12+).
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build project
        run: npm run build

  wasm:
    name: Build WASM modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc -v

      - name: Build all WASM modules
        run: npm run build:wasm

      - name: compile_commands.json exported for clangd
        run: test -s native/build/compile_commands.json && test -e native/compile_commands.json

      - name: Fail on committed-artifact drift
        run: |
          git --no-pager diff --stat -- public/wasm
          git --no-pager diff --exit-code -- public/wasm

  native-host:
    name: Native DSP host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # media_engine resampler / mix built with the host compiler (no Emscripten),
      # ASan + UBSan, run through ctest. Includes the THD+N goldens.
      - name: Build and run ctest
        run: bash scripts/test-native.sh
